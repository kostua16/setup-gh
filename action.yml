name: Setup the GitHub CLI (Fork by @kostua16)
description: 👨‍💻 Install & configure the GitHub CLI (gh) in your GitHub Actions runner (Fork by @kostua16)

branding:
  icon: terminal
  color: blue

inputs:
  gh-version:
    description: >
      Which version of 'gh' to install. This can be an exact version like
      '2.38.0' or a semver range like '2.38' or '2.x'. You can also specify
      'latest' to always use the latest version. The default is 'latest'.
    default: latest
  cli-token:
    description: >
      The GitHub token to use when pulling versions from cli/cli. By default
      this should cover all cases. You shouldn't have to touch this setting.
    default: |
      ${{ github.server_url == 'https://github.com' && github.token || '' }}
  token:
    description: >
      Token to use when running 'gh auth login'. This can be set to an empty
      string to skip the login step. By default this will use the token
      'github.token'.
    default: ${{ github.token }}
  switch-account:
    description: >
      Whether to switch later 'gh' commands to the provided token, even when
      another account is already authenticated. When true, this exports a
      fresh isolated 'GH_CONFIG_DIR' and the provided token as 'GH_TOKEN' for
      github.com or 'GH_ENTERPRISE_TOKEN' for GitHub Enterprise Server hosts.
      The action verifies the isolated config without letting token env vars
      shadow it.
    default: false
  skip-matching-version:
    description: >
      If false, skip installation when any 'gh' is already on PATH. If true,
      skip installation only when the installed version matches 'gh-version'.
    default: false
  github-server-url:
    description: >
      The GitHub server URL to use when running 'gh auth login'. Defaults to the
      current 'github.server_url'.
    default: ${{ github.server_url }}

outputs:
  gh-version:
    description: >
      The available version of 'gh'. This will be something like '2.38.0' or
      similar.
  auth:
    description: >
      A boolean indicating whether 'gh auth status --hostname' succeeds for the
      configured host after any login performed by this action.
  gh-config-dir:
    description: >
      The GitHub CLI config directory used by this action.

runs:
  using: node24
  main: dist/main.js
