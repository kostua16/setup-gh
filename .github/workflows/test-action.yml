name: Test action
on:
  push:
    branches: "main"
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
      - .github/**
      - "!.github/workflows/test-action.yml"
  pull_request:
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
      - .github/**
      - "!.github/workflows/test-action.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Reuse installed gh
        uses: ./
        with:
          token: ""
          skip-matching-version: "false"
      - run: gh --version
      - name: Reuse matching installed gh
        uses: ./
        with:
          token: ""
          gh-version: "2.x"
          skip-matching-version: "true"
      - name: Install requested gh when installed version differs
        uses: ./
        with:
          token: ""
          gh-version: "2.28.0"
          skip-matching-version: "true"
      - name: Existing GH_TOKEN does not break default auth
        uses: ./
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          token: ${{ github.token }}
      - name: Poison persisted gh auth state
        run: |
          mkdir -p "$HOME/.config/gh"
          cat > "$HOME/.config/gh/hosts.yml" <<'YAML'
          github.com:
            git_protocol: https
            oauth_token: stale-token
            user: "github-actions[bot]"
            users:
              "github-actions[bot]":
                oauth_token: stale-token
          YAML
      - name: Switch account uses isolated config
        id: switch-account
        uses: ./
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          token: ${{ github.token }}
          switch-account: "true"
      - run: test -z "${GH_TOKEN:-}"
      - run: test -n "$GH_CONFIG_DIR"
      - run: test "$GH_CONFIG_DIR" = "${{ steps.switch-account.outputs.gh-config-dir }}"
      - run: test "$GH_CONFIG_DIR" != "$HOME/.config/gh"
      - run: gh auth status --hostname github.com
      - name: Switch account creates a new isolated config dir
        id: switch-account-again
        uses: ./
        with:
          token: ${{ github.token }}
          switch-account: "true"
      - run: test -n "$GH_CONFIG_DIR"
      - run: test "$GH_CONFIG_DIR" = "${{ steps.switch-account-again.outputs.gh-config-dir }}"
      - run: test "${{ steps.switch-account.outputs.gh-config-dir }}" != "${{ steps.switch-account-again.outputs.gh-config-dir }}"
      - run: test "$GH_CONFIG_DIR" != "$HOME/.config/gh"
      - run: gh auth status --hostname github.com
      - name: Mock gh where env token shadows stored auth
        run: |
          fake_bin="$(mktemp -d)"
          cat > "$fake_bin/gh" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail

          case "$*" in
            "--version")
              echo "gh version 2.93.0 (mock)"
              ;;
            "auth login --with-token --hostname github.com")
              cat >/dev/null
              ;;
            "auth status --hostname github.com")
              if [ -n "${GH_TOKEN:-}" ]; then
                echo "github.com" >&2
                echo "  X Failed to log in to github.com account github-actions[bot] (GH_TOKEN)" >&2
                echo "  - The token in GH_TOKEN is invalid." >&2
                echo "  ✓ Logged in to github.com account github-actions[bot] (${GH_CONFIG_DIR}/hosts.yml)" >&2
                exit 1
              fi
              echo "github.com" >&2
              echo "  ✓ Logged in to github.com account github-actions[bot] (${GH_CONFIG_DIR}/hosts.yml)" >&2
              ;;
            *)
              echo "unexpected gh invocation: $*" >&2
              exit 2
              ;;
          esac
          BASH
          chmod +x "$fake_bin/gh"
          echo "$fake_bin" >> "$GITHUB_PATH"
      - name: Switch account clears env-token shadowing
        id: env-token-shadowed
        uses: ./
        with:
          token: mock-token
          switch-account: "true"
      - run: test "${{ steps.env-token-shadowed.outputs.auth }}" = "true"
      - run: test -z "${GH_TOKEN:-}"
      - run: gh auth status --hostname github.com
      - name: Mock gh auth status failure
        run: |
          fake_bin="$(mktemp -d)"
          cat > "$fake_bin/gh" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail

          case "$*" in
            "--version")
              echo "gh version 2.93.0 (mock)"
              ;;
            "auth login --with-token --hostname github.com")
              cat >/dev/null
              ;;
            "auth status --hostname github.com")
              echo "github.com: status failed" >&2
              echo "Token: mock-secret" >&2
              exit 1
              ;;
            *)
              echo "unexpected gh invocation: $*" >&2
              exit 2
              ;;
          esac
          BASH
          chmod +x "$fake_bin/gh"
          echo "$fake_bin" >> "$GITHUB_PATH"
      - name: Switch account reports false when auth status fails
        id: auth-status-fails
        uses: ./
        with:
          token: mock-token
          switch-account: "true"
      - run: test "${{ steps.auth-status-fails.outputs.auth }}" = "false"
