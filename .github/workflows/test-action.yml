name: Test action
on:
  push:
    branches: "main"
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
      - .github/**
      - "!.github/workflows/test-action.yml"
  pull_request:
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
      - .github/**
      - "!.github/workflows/test-action.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Reuse installed gh
        uses: ./
        with:
          token: ""
          skip-matching-version: "false"
      - run: gh --version
      - name: Reuse matching installed gh
        uses: ./
        with:
          token: ""
          gh-version: "2.x"
          skip-matching-version: "true"
      - name: Install requested gh when installed version differs
        uses: ./
        with:
          token: ""
          gh-version: "2.28.0"
          skip-matching-version: "true"
      - name: Existing GH_TOKEN does not break default auth
        uses: ./
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          token: ${{ github.token }}
      - name: Switch account exports provided token
        uses: ./
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          token: ${{ github.token }}
          switch-account: "true"
      - run: test -n "$GH_TOKEN"
      - run: gh auth status
